name = "slackline_live"
version = "0.1.0"
description = "Runs slackline against a real Slack workspace. Not published."
target = "erlang"

[dependencies]
slackline = { path = ".." }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
