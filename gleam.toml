name = "slackline"
version = "0.1.0"
description = "Slackline is a slack api client for gleam that attempts to port most of slack's api surface similar to projects like slack-edge"
licences = ["MIT"]
repository = { type = "tangled", user = "dunkirk.sh", repo = "slackline" }
links = [{ title = "Tangled", href = "https://tangled.org/dunkirk.sh/slackline" }]
internal_modules = ["slackline/internal", "slackline/internal/*"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_fetch = ">= 1.4.1 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
multipartkit = ">= 0.15.0 and < 1.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
